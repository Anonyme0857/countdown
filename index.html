<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compte à rebours AGF</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      /* Cadre extérieur vert forêt */
      background-color: #1b4332;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 14px;
    }

    .card {
      /* Fond intérieur vert sauge pastel */
      background-color: #d8f3dc;
      width: 100%;
      height: 100%;
      border-radius: 16px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    /* Émojis en filigrane dans les 4 coins */
    .corner-emoji {
      position: absolute;
      font-size: 24px;
      opacity: 0.35;
      user-select: none;
    }
    .top-left { top: 20px; left: 20px; }
    .top-right { top: 20px; right: 20px; }
    .bottom-left { bottom: 20px; left: 20px; }
    .bottom-right { bottom: 20px; right: 20px; }

    .subtitle {
      font-size: 15px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #40916c;
      margin-bottom: 14px;
      font-weight: 700;
    }

    .countdown {
      font-size: 25px;
      font-weight: 700;
      color: #1b4332;
    }
  </style>
</head>
<body>

  <div class="card">
    <span class="corner-emoji top-left">🌿</span>
    <span class="corner-emoji top-right">🌻</span>
    <span class="corner-emoji bottom-left">🌻</span>
    <span class="corner-emoji bottom-right">🌿</span>

    <div class="subtitle">🌿 AGF 🌻</div>

    <div class="countdown" id="timer">Chargement...</div>
  </div>

  <script>
    // Date cible : 2 avril 2027 à minuit
    const targetDate = new Date("2027-04-02T00:00:00").getTime();

    // Message affiché une fois arrivé au 2 avril
    const endMessage = "🌻 C’est le grand jour ! 🌿";

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = targetDate - now;

      if (distance <= 0) {
        document.getElementById("timer").innerHTML = endMessage;
        return;
      }

      // Math.ceil arrondit au jour supérieur pour compter le jour en cours
      const days = Math.ceil(distance / (1000 * 60 * 60 * 24));
      const label = days > 1 ? "jours" : "jour";

      document.getElementById("timer").innerHTML = `🌿 ${days} ${label} 🌻`;
    }

    updateCountdown();
    setInterval(updateCountdown, 60000);
  </script>

</body>
</html>
